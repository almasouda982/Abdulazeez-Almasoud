<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>compute_Salary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 480px;">
 <a href="main.html" class="btn btn-link px-0">&larr; Back</a>
    <h2 class="text-center">Compute Salary</h2>
    <p class="text-secondary text-center">annual = monthly × 12</p>

    <form class="card shadow-sm p-4 mx-auto" style="max-width: 480px;">
      <div class="mb-3">
        <label class="form-label">Employee name</label>
        <input id="name" class="form-control" value="Omar" />
      </div>
      <div class="mb-3">
        <label class="form-label">Monthly salary</label>
        <input id="sal" type="number" class="form-control" value="1000" />
      </div>
      <button id="btn"  class="btn btn-primary">Compute Annual</button>
      <div id="out" class="alert alert-info mt-3 d-none"></div>
    </div>
  </form>
  <script>
    document.getElementById("btn").onclick = function (e) {
      e.preventDefault();
      var name = document.getElementById("name").value;
      var sal = Number(document.getElementById("sal").value);
      var annual = sal * 12;
      var band;
      if (annual >= 12000) band = "High Salary";
      else if (annual >= 6000) band = "Normal Salary";
      else if (annual >= 3000) band = "Low salary";
      else band = "Very Low Salary";

      var out = document.getElementById("out");
      out.classList.remove("d-none");
      out.innerHTML = `Your name is: ${name}<br/> Monthly salary: ${sal}<br/> Annual salary: ${annual}<br/> Salary band: ${band}`;
    };
  </script>
</body>
</html>
