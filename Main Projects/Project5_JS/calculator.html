<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 480px;">
    <a href="main.html" class="btn btn-link px-0">&larr; Back</a>
    <h2 class="text-center">Calculator</h2>
    <p class="text-secondary text-center">+ - * /</p>

<div class="container mt-3">


  <form class="card shadow-sm p-4 mx-auto" style="max-width: 480px;">
    <div class="mb-3">
      <label for="num1" class="form-label">Number 1</label>
      <input type="number" class="form-control" id="num1" placeholder="Enter first number" value="10">
    </div>
    <div class="mb-3">
      <label for="num2" class="form-label">Number 2</label>
      <input type="number" class="form-control" id="num2" placeholder="Enter second number" value="5">
    </div>
    <div class="mb-3">
      <label for="operation" class="form-label">Operation</label>
      <select class="form-select" id="operation">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
    </div>
    <button type="button" class="btn btn-primary" onclick="calculate()">Calculate</button>
    <div id="out" class="alert alert-info mt-3 d-none"></div>

</form>
</div>

  <script>
    function calculate() {
      const num1 = parseFloat(document.getElementById('num1').value);
      const num2 = parseFloat(document.getElementById('num2').value);
      const operation = document.getElementById('operation').value;
      let result;

      if(operation === '+') {
        result = num1 + num2;
      } else if(operation === '-') {
        result = num1 - num2;
      } else if(operation === '*') {
        result = num1 * num2;
      } else if(operation === '/') {
        result = Math.round(num1 / num2);
      }
      
      document.getElementById('out').textContent = `The result is: ${result}`;
      document.getElementById('out').classList.remove('d-none');
    }
  </script>
</body>
</html>
