<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style class ="highlight">
        .highlight{
            background-color: yellow;
            color: black;
        }
        .normal{
            background-color: white;
            color: black;
        }
    </style>

    <p class ="highlight" id="paragraph">Yadda Yadda Yadda Yadda.</p>
</head>
<body>

    <button id="btn">Highlight</button>
    <script>


document.getElementById("btn").addEventListener("click", () =>{
document.getElementById("paragraph").classList.toggle("highlight");
document.getElementById("paragraph").classList.toggle("normal")
});

        


    </script>

    
</body>
</html>
