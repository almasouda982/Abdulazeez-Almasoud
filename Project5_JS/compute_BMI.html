<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>compute_BMI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 480px;">
     <a href="main.html" class="btn btn-link px-0">&larr; Back</a>
    <h2 class="text-center">Compute BMI</h2>
    <p class="text-secondary text-center">BMI = weight / (height/100) ^ 2</p>





      <form class="card shadow-sm p-4 mx-auto" style="max-width: 480px;">
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="name" class="form-control" id="name" placeholder="Enter your name" value="Omar">
    </div>
    <div class="mb-3">
      <label for="weight" class="form-label">Weight</label>
      <input type="number" class="form-control" id="weight" placeholder="Enter your weight" value="70">
    </div>
    <div class="mb-3">
      <label for="height" class="form-label">Height</label>
      <input type="number" class="form-control" id="height" placeholder="Enter your height" value="175">
    </div>
    <button type="button" class="btn btn-primary" id="btn">Calculate BMI</button>
    <div id="out" class="alert alert-info mt-3 d-none"></div>

</form>

  <script>
    document.getElementById("btn").onclick = function (e) {
      e.preventDefault();
      var name = document.getElementById("name").value;
      var weight = Number(document.getElementById("weight").value);
      var height = Number(document.getElementById("height").value);
      var bmi = weight / Math.pow((height / 100), 2);
      var type = "";
      var out = document.getElementById("out");

      out.classList.remove("alert-info", "alert-success", "alert-warning", "alert-danger");

      if (bmi >= 30){ 
        
        type = "Obese";
        out.classList.add("alert-danger");
    
    }
      else if (bmi >= 25){ 
        type = "Overweight";
        out.classList.add("alert-warning");
      }
      else if (bmi >= 18.5){ 
        type = "Normal";
        out.classList.add("alert-success");
      }
      else { 
        type = "Underweight";
        out.classList.add("alert-warning");
      }

      out.classList.remove("d-none");
      out.innerHTML = `Your name is: ${name}<br/> BMI = ${bmi} <br/> Your type weight type is: ${type}`;
    };
  </script>
</body>
</html>
