<div class="container mt-3">


  <form>
    <div class="mb-3">
      <label for="num1" class="form-label">Number 1</label>
      <input type="number" class="form-control" id="num1" placeholder="Enter first number">
    </div>
    <div class="mb-3">
      <label for="num2" class="form-label">Number 2</label>
      <input type="number" class="form-control" id="num2" placeholder="Enter second number">
    </div>
    <div class="mb-3">
      <label for="operation" class="form-label">Operation</label>
      <select class="form-select" id="operation">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
    </div>
    <button type="button" class="btn btn-primary" onclick="calculate()">Calculate</button>
    <div id="out" class="alert alert-info mt-3 d-none"></div>

</form>
</div>

  <script>
    function calculate() {
      const num1 = parseFloat(document.getElementById('num1').value);
      const num2 = parseFloat(document.getElementById('num2').value);
      const operation = document.getElementById('operation').value;
      let result;

      if(operation === '+') {
        result = num1 + num2;
      } else if(operation === '-') {
        result = num1 - num2;
      } else if(operation === '*') {
        result = num1 * num2;
      } else if(operation === '/') {
        result = Math.round(num1 / num2);
      }
      document.getElementById('out').textContent = `Result: ${result}`;
      document.getElementById('out').classList.remove('d-none');
    }
  </script>
